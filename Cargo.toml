[workspace]
resolver = "2"
members = [
    "programs/amm",
    "client",
    "tests"
]

[workspace.dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "<1.17.0"
solana-program-test = "<1.17.0"
solana-sdk = "<1.17.0"
tokio = { version = "1.14", features = ["full"] }
spl-token-2022 = {version = "0.9.0", default-features = false, features = ["no-entrypoint"]}
num_enum = "0.6.1"

[profile.test]
opt-level = 0

[profile.release]
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
